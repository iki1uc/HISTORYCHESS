<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IKI1UC · ANIME · HISTORY CHESS · FULL EDITION</title>

    <style>
        body {
            margin:0;
            background:#000;
            color:#fff;
            font-family:Consolas, monospace;
            overflow:hidden;
        }
        #boardWrap {
            position:relative;
            width:100vw;
            height:100vh;
        }
        #atmoCanvas, #chessCanvas {
            position:absolute;
            top:0; left:0;
            width:100%; height:100%;
        }
        #atmoCanvas { z-index:0; pointer-events:none; }
        #chessCanvas { z-index:1; }

        #ui {
            position:absolute;
            top:10px;
            left:10px;
            z-index:10;
            background:rgba(0,0,0,0.4);
            padding:10px;
            border-radius:8px;
            font-size:12px;
        }
        button {
            background:#ffd700;
            border:none;
            padding:6px 10px;
            margin:3px;
            border-radius:4px;
            cursor:pointer;
            font-family:inherit;
        }
    </style>
</head>

<body>

<div id="boardWrap">
    <canvas id="atmoCanvas"></canvas>
    <canvas id="chessCanvas"></canvas>
</div>

<div id="ui">
    <button id="btnStep">Zug</button>
    <button id="btnAuto">Auto</button>
    <button id="btnResetBoard">Reset Board</button>
    <button id="btnGeneral">General Run</button>
    <button id="btnPump">Pump</button>
    <button id="btnRandom">Random</button>
    <button id="btnToggleAll">Toggle Axles</button>
    <button id="btnReset">Reset Engine</button>
</div>

<script type="module">
import { AtmoBoard } from "./JS/atmo/atmoBoard.js";
import { initBoard, renderBoard } from "./JS/chess/board.js";
import { loadGame, allGames, playNextMove } from "./JS/chess/replay.js";
import { engine } from "./JS/engine/general.js";
import { bindUI } from "./JS/ui/events.js";
import { resizeCanvases } from "./JS/ui/resize.js";

document.addEventListener("DOMContentLoaded", () => {

    const atmoCanvas = document.getElementById("atmoCanvas");
    const chessCanvas = document.getElementById("chessCanvas");

    // Canvas Pixelgröße setzen
    resizeCanvases(atmoCanvas, chessCanvas);
    window.addEventListener("resize", () => resizeCanvases(atmoCanvas, chessCanvas));

    // AtmoBoard starten
    window.atmo = new AtmoBoard(atmoCanvas);
    atmo.setMood("anime");
    atmo.start();

    // Schachbrett starten
    initBoard(chessCanvas);
    renderBoard(chessCanvas);

    // Erstes Spiel laden
    if (allGames.length > 0) {
        loadGame(allGames[0]);
    }

    // Engine starten
    engine.init();

    // UI verbinden
    bindUI({
        playNextMove,
        loadGame,
        engine,
        atmo
    });

    console.log("⭐ FULL ANIME EDITION gestartet");
});
</script>

</body>
</html>
